services:
  comfyui:
    build:
      context: ./comfyui
    restart: unless-stopped
    command: ["python3","main.py","--listen","0.0.0.0","--port","8188"]
    volumes:
      - ./models:/opt/ComfyUI/models
      - ./outputs:/opt/ComfyUI/output
    expose:
      - "8188"
    gpus: all
    healthcheck:
      test: ["CMD-SHELL","curl -fsS http://127.0.0.1:8188/system_stats >/dev/null || exit 1"]
      interval: 30s
      timeout: 8s
      retries: 10
      start_period: 180s

  salah-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      COMFYUI_URL: http://comfyui:8188
      SALAHDATA: /data
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN in engine/.env before starting}
      TTS_PROVIDER: local
      CHATTERBOX_URL: http://chatterbox:8010
      CHATTERBOX_INTERNAL_TOKEN: ${CHATTERBOX_INTERNAL_TOKEN:-}
      COMFY_TIMEOUT_SECONDS: 1800
      CORS_ORIGINS: ${CORS_ORIGINS:-https://salah-aser.github.io,http://localhost:8000,http://127.0.0.1:8000}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - salah_data:/data
    depends_on:
      comfyui:
        condition: service_healthy

  chatterbox:
    profiles: ["chatterbox"]
    build:
      context: ./voice_engine
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      CHATTERBOX_DEVICE: ${CHATTERBOX_DEVICE:-cpu}
      CHATTERBOX_REFERENCE_AUDIO: /reference/voice.wav
      CHATTERBOX_INTERNAL_TOKEN: ${CHATTERBOX_INTERNAL_TOKEN:-}
      HF_HOME: /models/huggingface
    volumes:
      - ./voice/reference:/reference:ro
      - chatterbox_cache:/models
    expose:
      - "8010"

  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in engine/.env to enable HTTPS}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - salah-api

volumes:
  salah_data:
  chatterbox_cache:
  caddy_data:
  caddy_config:
