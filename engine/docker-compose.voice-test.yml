# Voice-only test stack. It deliberately does not start ComfyUI or the video GPU.
# From the repository root:
#   docker compose --env-file engine/.env -f engine/docker-compose.voice-test.yml up -d --build
services:
  chatterbox:
    build:
      context: ./voice_engine
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      CHATTERBOX_DEVICE: ${CHATTERBOX_DEVICE:-cpu}
      CHATTERBOX_REFERENCE_AUDIO: /reference/voice.wav
      CHATTERBOX_INTERNAL_TOKEN: ${CHATTERBOX_INTERNAL_TOKEN:-}
      HF_HOME: /models/huggingface
    volumes:
      - ./voice/reference:/reference:ro
      - chatterbox_cache:/models
    expose:
      - "8010"

  salah-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      COMFYUI_URL: http://comfyui:8188
      SALAHDATA: /data
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN in engine/.env before starting}
      TTS_PROVIDER: chatterbox
      CHATTERBOX_URL: http://chatterbox:8010
      CHATTERBOX_INTERNAL_TOKEN: ${CHATTERBOX_INTERNAL_TOKEN:-}
      PROMPT_TRANSLATION_ENABLED: "false"
      COMFY_TIMEOUT_SECONDS: 1800
      CORS_ORIGINS: ${CORS_ORIGINS:-https://salah-aser.github.io,http://localhost:8000,http://127.0.0.1:8000}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - salah_data:/data

volumes:
  salah_data:
  chatterbox_cache:
