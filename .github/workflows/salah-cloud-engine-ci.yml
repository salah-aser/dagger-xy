name: Salah Cloud Engine checks
on:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - ".github/workflows/salah-cloud-engine-ci.yml"
  pull_request:
    paths:
      - "engine/**"
      - ".github/workflows/salah-cloud-engine-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - name: Install API dependencies
        run: python -m pip install -r engine/requirements.txt pytest
      - name: Compile server
        run: python -m py_compile engine/server.py
      - name: Check setup scripts
        run: bash -n engine/setup.sh engine/download_wan22_14b.sh
      - name: Validate Docker Compose YAML
        run: python -c "import yaml; yaml.safe_load(open('engine/docker-compose.yml', encoding='utf-8'))"
      - name: Run unit tests
        working-directory: engine
        run: python -m pytest -q
